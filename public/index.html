<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LABASAD Office Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#0b0b12; --paper:#fff6e3; --blue:#2f6fed;
    --orange:#ff8c42; --yellow:#ffd23f; --green:#3ddc84; --red:#ff4d5e;
  }
  *{box-sizing:border-box;}
  body{margin:0; height:100vh; overflow:hidden; background:#0b0b12; font-family:'Press Start 2P', monospace; color:var(--paper);}
  #app{width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; position:relative;}

  .pixel-box{
    border:6px solid var(--ink); box-shadow:0 0 0 6px var(--paper), 0 0 0 12px var(--ink);
    background:rgba(11, 11, 18, 0.92); padding:28px; text-align:center; position:relative; z-index:10;
  }
  .pixel-btn{
    font-family:'Press Start 2P'; padding:16px 28px; background:var(--orange); color:var(--ink);
    border:4px solid var(--ink); box-shadow:6px 6px 0 var(--ink); cursor:pointer; margin-top:20px;
  }
  .pixel-btn:active{transform:translate(4px,4px); box-shadow:2px 2px 0 var(--ink);}

  /* MAPA PRINCIPAL CON FONDO DE OFICINA ILUSTRADO */
  #map-container{
    width:800px; height:500px; border:8px solid var(--paper); box-shadow:0 0 30px rgba(0,0,0,0.9);
    position:relative; overflow:hidden; background-size:cover; background-position:center;
  }
  .bg-office{ background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80'); }
  
  /* PERSONAJE PIXEL ART DIBUJADO EN CANVAS / CSS */
  .pixel-avatar{
    position:absolute; width:32px; height:42px; transform:translate(-50%, -100%);
    transition:left 0.05s linear, top 0.05s linear;
  }
  .pixel-avatar .head{ width:24px; height:22px; background:#f4c293; border:3px solid #000; margin:0 auto; position:relative; }
  .pixel-avatar .hair{ position:absolute; top:-4px; left:-3px; right:-3px; height:10px; background:#5a3825; border:2px solid #000; }
  .pixel-avatar .body{ width:28px; height:18px; background:var(--red); border:3px solid #000; margin:0 auto; }
  .pixel-avatar .nametag{ position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:0.45rem; background:#000; color:#fff; padding:2px 6px; border:1px solid #fff; white-space:nowrap; }

  /* ROMBOS CHECKPOINT */
  .rhombus{
    position:absolute; width:40px; height:40px; background:var(--yellow); border:4px solid var(--ink);
    transform:rotate(45deg); animation:pulse 1s infinite alternate; display:flex; align-items:center; justify-content:center;
  }
  @keyframes pulse{ from{transform:rotate(45deg) scale(0.85); box-shadow:0 0 10px var(--yellow);} to{transform:rotate(45deg) scale(1.15); box-shadow:0 0 25px var(--yellow);} }

  /* RETOS SPLIT SCREEN SOBRE FONDO OFICINA OSCURECIDO */
  .split-screen{ display:flex; width:950px; height:520px; gap:20px; position:relative; z-index:5; }
  .overlay-bg{ position:absolute; inset:0; background:rgba(11,11,18,0.85); backdrop-filter:blur(4px); }
  
  .left-panel{ flex:1.2; background:rgba(0,0,0,0.7); border:4px solid var(--paper); padding:20px; z-index:2; }
  .right-panel{ flex:1; background:rgba(0,0,0,0.85); border:4px solid var(--paper); padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2; text-align:center; }

  .player-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:0.6rem; }
  .bar-outer{ flex:1; height:20px; background:#000; border:2px solid var(--paper); }
  .bar-inner{ height:100%; background:var(--green); transition:width 0.1s; }

  /* VASO CAFÉ SIROKO DETALLADO PIXEL ART */
  .pixel-coffee-glass{
    width:120px; height:180px; border:5px solid var(--paper); border-top:none;
    position:relative; background:rgba(255,255,255,0.15); overflow:hidden; border-radius:0 0 16px 16px;
  }
  .liquid{ position:absolute; bottom:0; width:100%; background:#4a2e1b; border-top:4px solid #8c5a3c; transition:height 0.15s; }
  .pixel-ice{ position:absolute; width:24px; height:24px; background:rgba(255,255,255,0.8); border:2px solid #000; }

  /* MODAL DE INTRODUCCIÓN CONTEXTUAL */
  .intro-modal{
    position:absolute; z-index:100; max-width:650px; background:var(--ink); border:6px solid var(--yellow); padding:28px; text-align:center;
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let currentState = null;

// SINTETIZADOR MÚSICA CHIPTUNE DE FONDO
let audioStarted = false;
function startBGM() {
  if (audioStarted) return;
  audioStarted = true;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const notes = [261.63, 329.63, 392.00, 523.25];
  let step = 0;
  setInterval(() => {
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(notes[step % notes.length], ctx.currentTime);
    gain.gain.setValueAtTime(0.03, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.18);
    step++;
  }, 220);
}

socket.on('state', (state) => {
  currentState = state;
  render();
});

function el(html){
  const div = document.createElement('div');
  div.innerHTML = html;
  return div.firstElementChild;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (!currentState) return;

  if (currentState.room === 1) app.appendChild(renderLobby());
  else if (currentState.room === 2) app.appendChild(renderMap());
  else if (currentState.room >= 3 || currentState.inChallenge || currentState.showIntro) app.appendChild(renderChallengeStage());
  else if (currentState.room === 5) app.appendChild(renderSummary());
  else if (currentState.room === 6) app.appendChild(renderGoodbye());
}

// 1. PANTALLA INICIAL ORIGINAL
function renderLobby(){
  const players = Object.values(currentState.players);
  const avatarsHtml = players.map(p => `
    <div style="background:var(--paper); color:#000; padding:8px 12px; border:3px solid #000; font-size:0.6rem;">👤 ${p.name}</div>
  `).join('');

  const wrapper = el(`
    <div class="pixel-box" style="max-width:850px;">
      <h1 style="font-size:1.8rem; margin-bottom:12px;">🏢 LABASAD OFFICE QUEST</h1>
      <p style="font-size:0.75rem; line-height:1.8;">Escanea el código QR con tu móvil para unirte como mando.<br>¡Controla tu personaje en la pantalla grande!</p>
      <div id="qr-holder" style="background:#fff; padding:16px; display:inline-block; border:6px solid #000; margin:20px 0;"></div>
      <div style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:16px 0;">${avatarsHtml || '<p style="font-size:0.6rem;">Esperando jugadores...</p>'}</div>
      <button class="pixel-btn" id="startBtn">▶ INICIAR AVENTURA</button>
    </div>
  `);

  setTimeout(() => {
    new QRCode(wrapper.querySelector('#qr-holder'), {
      text: 'https://labasad-game.onrender.com/mando.html',
      width: 220, height: 220
    });
  }, 50);

  wrapper.querySelector('#startBtn').addEventListener('click', () => {
    startBGM();
    socket.emit('start-game');
  });

  return wrapper;
}

// 2. MAPA INTERACTIVO DE LA OFICINA
function renderMap(){
  const players = Object.values(currentState.players);
  const spritesHtml = players.map(p => `
    <div class="pixel-avatar" style="left:${p.x}px; top:${p.y}px;">
      <span class="nametag">${p.name}</span>
      <div class="head"><div class="hair"></div></div>
      <div class="body"></div>
    </div>
  `).join('');

  // Checkpoint activo
  const cpNames = { 2: 'HUB SPOT', 3: 'SEO BLOG', 4: 'SIROKO CAFÉ' };
  const cpCoords = { 2: {x:220,y:320}, 3: {x:580,y:320}, 4: {x:400,y:150} };
  const activeCP = cpCoords[currentState.currentChallenge];

  const wrapper = el(`
    <div style="display:flex; flex-direction:column; align-items:center;">
      <h2 style="font-size:1rem; color:var(--yellow); margin-bottom:12px;">📍 MISIÓN: LLEGA AL CHECKPOINT DE ${cpNames[currentState.currentChallenge]}</h2>
      <div id="map-container" class="bg-office">
        <div class="rhombus" style="left:${activeCP.x}px; top:${activeCP.y}px;"></div>
        ${spritesHtml}
      </div>
    </div>
  `);

  // Pantalla Modal contextual
  if (currentState.showIntro) {
    const intros = {
      2: { title:'💻 RETO 1: HUBSPOT & CRM', text:'¡Las secuencias de correo se han descontrolado! Pulsa 100 veces para enviar todos los emails de nutrición de leads.' },
      3: { title:'📝 RETO 2: REDACCIÓN SEO', text:'¡El blog de LABASAD necesita publicar el nuevo protocolo! Pulsa 100 veces para redactar el artículo completo.' },
      4: { title:'☕ RETO 3: TERRAZA SIROKO', text:'¡Llegó la hora del café! Llena el vaso helado con 100 toques antes de que se derrita el hielo.' }
    };
    const info = intros[currentState.currentChallenge];
    const modal = el(`
      <div class="intro-modal">
        <h2 style="color:var(--yellow); font-size:1rem; margin-bottom:16px;">${info.title}</h2>
        <p style="font-size:0.7rem; line-height:1.8; margin-bottom:24px;">${info.text}</p>
        <button class="pixel-btn" id="readyBtn" style="background:var(--green);">¡ESTOY LISTO!</button>
      </div>
    `);
    modal.querySelector('#readyBtn').addEventListener('click', () => socket.emit('confirm-intro'));
    wrapper.appendChild(modal);
  }

  return wrapper;
}

// 3. ETAPA DE RETOS SPLIT SCREEN
function renderChallengeStage(){
  const players = Object.values(currentState.players);
  const ch = currentState.currentChallenge;
  const winner = currentState.winners[ch];

  const totalTaps = players.reduce((sum, p) => sum + p.taps, 0);
  const progressPct = Math.min(100, Math.round((totalTaps / (players.length * 100)) * 100));

  const rows = players.map(p => `
    <div class="player-row">
      <span style="min-width:120px;">👤 ${p.name}</span>
      <div class="bar-outer"><div class="bar-inner" style="width:${p.taps}%;"></div></div>
      <span>${p.taps}/100</span>
    </div>
  `).join('');

  let rightContent = '';
  if (ch === 2) {
    rightGraphic = `
      <h3 style="font-size:0.8rem; color:var(--orange); margin-bottom:16px;">AUTOMATIZACIÓN HUBSPOT</h3>
      <div style="font-size:0.7rem; line-height:2;">EMAILS ENVIADOS: ${totalTaps * 15}<br>LEADS QUALIFIED: ${totalTaps}</div>
    `;
  } else if (ch === 3) {
    const text = "PROTOCOLOS SEO LABASAD 2026: Guía completa de optimización web, estructura de contenidos corporativos y gestión de incidencias en Polser...";
    const visibleText = text.substring(0, Math.floor((progressPct/100) * text.length));
    rightGraphic = `
      <h3 style="font-size:0.8rem; color:var(--blue); margin-bottom:16px;">REDACTANDO ARTÍCULO SEO</h3>
      <div style="width:240px; height:240px; background:#fff; color:#000; padding:16px; font-size:0.5rem; text-align:left; border:4px solid #000;">
        ${visibleText}<span style="display:inline-block; width:8px; height:12px; background:var(--blue);"></span>
      </div>
    `;
  } else if (ch === 4) {
    rightGraphic = `
      <h3 style="font-size:0.8rem; color:var(--yellow); margin-bottom:16px;">SIROKO COFFEE SHOP</h3>
      <div class="pixel-coffee-glass">
        <div class="liquid" style="height:${progressPct}%;"></div>
        <div class="pixel-ice" style="left:20px; top:30px;"></div>
        <div class="pixel-ice" style="left:60px; top:50px;"></div>
      </div>
    `;
  }

  const bgClass = ch === 4 ? 'style="background-image:url(\'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80\'); background-size:cover;"' : 'class="bg-office"';

  const winnerBanner = winner ? `
    <div class="pixel-box" style="position:absolute; z-index:20; background:rgba(11,11,18,0.95);">
      <h2 style="color:var(--yellow); margin-bottom:12px;">🏆 ¡RETO SUPERADO! 🏆</h2>
      <p style="font-size:0.8rem;">Ganador: <b>${winner.name}</b></p>
      <p style="font-size:0.65rem; color:var(--green); margin-top:8px;">${winner.achievement}</p>
    </div>
  ` : '';

  const wrapper = el(`
    <div id="map-container" ${bgClass} style="width:950px; height:520px; display:flex; align-items:center; justify-content:center;">
      <div class="overlay-bg"></div>
      <div class="split-screen">
        <div class="left-panel">
          <h3 style="font-size:0.8rem; margin-bottom:16px; color:var(--yellow);">⚡ CARRERA 100 TAPS</h3>
          ${rows}
        </div>
        <div class="right-panel">
          ${rightGraphic}
        </div>
      </div>
      ${winnerBanner}
    </div>
  `);

  return wrapper;
}

// 4. RESUMEN Y DESPEDIDA
function renderSummary(){
  const winners = currentState.winners;
  const rows = [2,3,4].map(r => winners[r] ? `<tr><td>${winners[r].name}</td><td>${winners[r].achievement}</td></tr>` : '').join('');
  const wrapper = el(`
    <div class="pixel-box" style="max-width:850px;">
      <h1 style="font-size:1.4rem;">📊 RESUMEN DE PRÁCTICAS LABASAD</h1>
      <table style="width:100%; margin:20px 0; font-size:0.65rem; border-collapse:collapse;">
        <tr style="background:var(--blue); color:#fff;"><th>Ganador</th><th>Logro</th></tr>
        ${rows}
      </table>
      <button class="pixel-btn" id="nextBtn" style="background:var(--green);">➡ CONTINUAR</button>
    </div>
  `);
  wrapper.querySelector('#nextBtn').addEventListener('click', () => socket.emit('next-room'));
  return wrapper;
}

function renderGoodbye(){
  return el(`
    <div class="pixel-box" style="max-width:800px;">
      <h1>🎉 GAME OVER — ¡VICTORIA! 🎉</h1>
      <p style="line-height:2; margin-top:16px;">¡Muchas gracias al equipo de <b>LABASAD</b>!<br>Prácticas completadas con éxito. 👾</p>
    </div>
  `);
}
</script>
</body>
</html>
