<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LABASAD Office Quest 2D — Host</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#0b0b12; --paper:#fff6e3; --blue:#2f6fed;
    --orange:#ff8c42; --yellow:#ffd23f; --green:#3ddc84; --red:#ff4d5e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; overflow:hidden; background:#000; font-family:'Press Start 2P', monospace; color:var(--paper);}
  #app{width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; position:relative;}

  .pixel-box{
    border:6px solid var(--ink); box-shadow:0 0 0 6px var(--paper), 0 0 0 12px var(--ink);
    background:rgba(18, 18, 28, 0.95); padding:24px; border-radius:2px; text-align:center;
  }

  /* ---- MAPA 2D ---- */
  #game-canvas-container{
    width:800px; height:500px; background:#2a2438; border:8px solid var(--paper);
    box-shadow:0 0 20px rgba(0,0,0,0.8); position:relative; overflow:hidden;
  }
  .map-grid{
    position:absolute; inset:0;
    background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .office-desk{
    position:absolute; background:#5c3c21; border:4px solid var(--ink); color:#fff;
    font-size:0.5rem; display:flex; align-items:center; justify-content:center;
  }
  .checkpoint-rhombus{
    position:absolute; left:375px; top:125px; width:50px; height:50px;
    background:var(--yellow); border:4px solid var(--ink); transform:rotate(45deg);
    animation:pulse 1.2s infinite alternate; display:flex; align-items:center; justify-content:center;
  }
  @keyframes pulse{ from{transform:rotate(45deg) scale(0.9); box-shadow:0 0 10px var(--yellow);} to{transform:rotate(45deg) scale(1.1); box-shadow:0 0 25px var(--yellow);} }
  
  .player-sprite{
    position:absolute; width:40px; height:40px; transform:translate(-50%, -50%);
    display:flex; flex-direction:column; align-items:center; transition:left 0.05s linear, top 0.05s linear;
  }
  .player-sprite .name-tag{
    font-size:0.45rem; background:rgba(0,0,0,0.7); padding:2px 4px; border-radius:3px;
    white-space:nowrap; margin-bottom:2px; border:1px solid var(--paper);
  }
  .player-sprite .avatar-icon{font-size:1.6rem;}

  /* ---- RETOS SPLIT SCREEN ---- */
  .split-screen{display:flex; width:1000px; height:550px; gap:20px;}
  .left-panel{flex:1.2; background:rgba(0,0,0,0.6); border:4px solid var(--ink); padding:16px;}
  .right-panel{flex:1; background:rgba(0,0,0,0.8); border:4px solid var(--ink); padding:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative;}

  .player-row{display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:0.6rem;}
  .bar-outer{flex:1; height:18px; background:#000; border:2px solid var(--paper);}
  .bar-inner{height:100%; background:var(--green); transition:width 0.1s;}

  /* ANIMACIÓN RETO 2: BLOG SEO (Documento escribiéndose) */
  .doc-animation{
    width:220px; height:280px; background:#fff; color:#0b0b12; padding:16px;
    border:4px solid var(--ink); font-size:0.5rem; line-height:1.6; text-align:left; overflow:hidden;
    box-shadow:6px 6px 0 var(--blue);
  }
  .typing-cursor{display:inline-block; width:8px; height:12px; background:var(--blue); animation:blink 0.6s infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ANIMACIÓN RETO 3: SIROKO COFFEE (Vaso llenándose) */
  .coffee-cup{
    width:140px; height:200px; border:6px solid var(--paper); border-top:none;
    border-radius:0 0 20px 20px; position:relative; overflow:hidden; background:rgba(255,255,255,0.1);
  }
  .coffee-liquid{
    position:absolute; bottom:0; width:100%; background:#6f4e37; transition:height 0.2s;
  }
  .ice-cube{position:absolute; font-size:1.5rem; animation:floatIce 2s infinite alternate;}
  @keyframes floatIce{from{transform:translateY(0);} to{transform:translateY(-8px);}}

  /* QR OVERLAY EN MAPA */
  .qr-overlay{
    position:absolute; right:20px; top:20px; background:#fff; padding:10px;
    border:4px solid var(--ink); text-align:center; color:#000; font-size:0.5rem;
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let currentState = null;

socket.on('state', (state) => {
  currentState = state;
  render();
});

function el(html){
  const div = document.createElement('div');
  div.innerHTML = html;
  return div.firstElementChild;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (!currentState) return;

  if (currentState.room === 1 && !currentState.inChallenge) {
    app.appendChild(renderMap());
  } else if (currentState.room >= 2 && currentState.room <= 4) {
    app.appendChild(renderSplitChallenge());
  } else if (currentState.room === 5) {
    app.appendChild(renderSummary());
  } else if (currentState.room === 6) {
    app.appendChild(renderGoodbye());
  }
}

// ---------- MAPA 2D INTERACTIVO ----------
function renderMap(){
  const players = Object.values(currentState.players);
  const playersSprites = players.map(p => `
    <div class="player-sprite" style="left:${p.x}px; top:${p.y}px;">
      <span class="name-tag">${p.name}</span>
      <span class="avatar-icon">${p.avatar}</span>
    </div>
  `).join('');

  const wrapper = el(`
    <div style="display:flex; flex-direction:column; align-items:center;">
      <h1 style="font-size:1.2rem; margin-bottom:12px;">🏢 OFICINA LABASAD — EXPLORACIÓN 2D</h1>
      <p style="font-size:0.6rem; color:var(--yellow); margin-bottom:16px;">
        Mueve tu personaje con el Joystick del móvil hasta el ROMBO AMARILLO para iniciar el reto.
      </p>

      <div id="game-canvas-container">
        <div class="map-grid"></div>
        <!-- Muebles de la oficina -->
        <div class="office-desk" style="left:100px; top:100px; width:140px; height:70px;">MESA HUBSPOT 💻</div>
        <div class="office-desk" style="left:560px; top:100px; width:140px; height:70px;">MESA SEO 📝</div>
        <div class="office-desk" style="left:330px; top:360px; width:140px; height:70px;">TERRAZA CAFÉ ☕</div>

        <!-- ROMBO INTERACTIVO -->
        <div class="checkpoint-rhombus">
          <span style="transform:rotate(-45deg); font-size:1.2rem;">⚡</span>
        </div>

        <!-- Sprites de Jugadores -->
        ${playersSprites}

        <!-- QR flotante para que se unan más -->
        <div class="qr-overlay">
          <div id="map-qr"></div>
          <p style="margin-top:4px;">ÚNETE CON EL MÓVIL</p>
        </div>
      </div>
    </div>
  `);

  setTimeout(() => {
    const qrDiv = wrapper.querySelector('#map-qr');
    if (qrDiv) {
      new QRCode(qrDiv, {
        text: 'https://labasad-game.onrender.com/mando.html',
        width: 100, height: 100
      });
    }
  }, 50);

  return wrapper;
}

// ---------- RETOS SPLIT-SCREEN CON ANIMACIÓN DINÁMICA ----------
function renderSplitChallenge(){
  const room = currentState.room;
  const players = Object.values(currentState.players);
  const winner = currentState.winners[room];

  // Cálculo de toques totales del equipo para animaciones
  const totalTaps = players.reduce((sum, p) => sum + p.taps, 0);
  const maxPossible = Math.max(1, players.length * 50);
  const progressPct = Math.min(100, Math.round((totalTaps / maxPossible) * 100));

  // Filas de jugadores (Panel Izquierdo)
  const rows = players.map(p => {
    const pct = Math.min(100, Math.round((p.taps / 50) * 100));
    return `
      <div class="player-row">
        <span>${p.avatar} ${p.name}</span>
        <div class="bar-outer"><div class="bar-inner" style="width:${pct}%;"></div></div>
        <span>${p.taps}/50</span>
      </div>
    `;
  }).join('');

  // CONTENIDO DINÁMICO PANEL DERECHO SEGÚN SALA
  let rightGraphic = '';
  
  if (room === 2) {
    // Reto 1: HubSpot / Secuencias
    rightGraphic = `
      <h3 style="font-size:0.7rem; color:var(--orange); margin-bottom:12px;">ENVIANDO SECUENCIAS HUBSPOT</h3>
      <div style="font-size:3rem; margin-bottom:10px;">📧 ➔ 📈</div>
      <p style="font-size:0.6rem; color:var(--green);">Emails Enviados: ${totalTaps * 12}</p>
    `;
  } else if (room === 3) {
    // Reto 2: Redacción SEO (Texto escribiéndose)
    const textSample = "PROTOCOLOS BLOG LABASAD 2026: Optimización de artículos SEO, estructura de encabezados H2/H3, integración de palabras clave y atención de incidencias en Polser...";
    const visibleChars = Math.floor((progressPct / 100) * textSample.length);
    rightGraphic = `
      <h3 style="font-size:0.7rem; color:var(--blue); margin-bottom:12px;">REDACTANDO ARTÍCULO SEO</h3>
      <div class="doc-animation">
        <b>DRAFT_PROTOCOL.DOC</b><br><br>
        ${textSample.substring(0, visibleChars)}<span class="typing-cursor"></span>
      </div>
    `;
  } else if (room === 4) {
    // Reto 3: Siroko Coffee (Vaso llenándose)
    rightGraphic = `
      <h3 style="font-size:0.7rem; color:var(--yellow); margin-bottom:12px;">LLENANDO CAFÉ CON HIELOS</h3>
      <div class="coffee-cup">
        <div class="coffee-liquid" style="height:${progressPct}%;"></div>
        <span class="ice-cube" style="left:20px; top:40px;">🧊</span>
        <span class="ice-cube" style="left:70px; top:60px;">🧊</span>
      </div>
      <p style="font-size:0.55rem; margin-top:10px;">¡Cuidado no lo vuelques!</p>
    `;
  }

  const winnerBanner = winner ? `
    <div class="pixel-box" style="position:absolute; inset:20px; z-index:10; background:rgba(11,11,18,0.95); display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <h2 style="color:var(--yellow);">🏆 ¡RETO SUPERADO! 🏆</h2>
      <p style="margin:16px 0;">Ganador: <b>${winner.avatar} ${winner.name}</b></p>
      <p style="font-size:0.7rem; color:var(--green);">${winner.achievement}</p>
    </div>
  ` : '';

  const wrapper = el(`
    <div class="split-screen" style="position:relative;">
      <div class="left-panel">
        <h2 style="font-size:0.9rem; margin-bottom:16px;">⚡ CARRERA DE PULSACIONES</h2>
        ${rows}
      </div>
      <div class="right-panel">
        ${rightGraphic}
      </div>
      ${winnerBanner}
    </div>
  `);

  return wrapper;
}

// ---------- SALA 5: RESUMEN ----------
function renderSummary(){
  const winners = currentState.winners;
  const rows = [2,3,4].map(r => {
    const w = winners[r];
    if (!w) return '';
    return `<tr><td>${w.avatar} ${w.name}</td><td>${w.achievement}</td></tr>`;
  }).join('');

  const wrapper = el(`
    <div class="pixel-box" style="max-width:900px;">
      <h1>📊 APRENDIZAJES DE LAS PRÁCTICAS</h1>
      <table style="width:100%; border-collapse:collapse; margin:20px 0; font-size:0.65rem;">
        <tr style="background:var(--blue);"><th>Ganador</th><th>Logro Desbloqueado</th></tr>
        ${rows}
      </table>
      <button class="pixel-btn" id="nextBtn" style="padding:16px 24px; background:var(--green); font-family:'Press Start 2P'; cursor:pointer;">➡ DESPEDIDA</button>
    </div>
  `);
  wrapper.querySelector('#nextBtn').addEventListener('click', () => socket.emit('next-room'));
  return wrapper;
}

// ---------- SALA 6: DESPEDIDA ----------
function renderGoodbye(){
  return el(`
    <div class="pixel-box" style="max-width:800px;">
      <h1>🎉 GAME OVER — ¡VICTORIA! 🎉</h1>
      <p style="line-height:2;">Gracias a todo el equipo de <b>LABASAD</b>.<br>
      ¡Una práctica inolvidable! 👾</p>
    </div>
  `);
}
</script>
</body>
</html>
