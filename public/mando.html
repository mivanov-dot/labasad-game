<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LABASAD Quest — Mando</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; touch-action:none; user-select:none;}
  body{
    margin:0; height:100vh; background:#12121c; color:#fff6e3;
    font-family:'Press Start 2P', monospace; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between; padding:20px; overflow:hidden;
  }
  .login-box{display:flex; flex-direction:column; gap:14px; width:100%; max-width:320px; margin:auto; text-align:center;}
  input, select{
    padding:14px; font-family:'Press Start 2P', monospace; font-size:0.65rem;
    background:#fff6e3; border:4px solid #0b0b12; text-align:center;
  }
  button.btn{
    padding:18px; background:#3ddc84; font-family:'Press Start 2P'; border:4px solid #0b0b12;
    box-shadow:0 6px 0 #0b0b12; cursor:pointer; font-size:0.75rem; color:#0b0b12;
  }
  button.btn:active{transform:translateY(4px); box-shadow:0 2px 0 #0b0b12;}
  #action-btn{
    width:100%; max-width:300px; height:180px; background:#ff4d5e;
    border:6px solid #0b0b12; box-shadow:0 10px 0 #0b0b12; color:#fff;
    font-family:'Press Start 2P'; font-size:1.3rem; border-radius:16px; margin:auto;
  }
  #action-btn:active{transform:translateY(8px); box-shadow:0 2px 0 #0b0b12; background:#e03e4f;}
</style>
</head>
<body>

<div id="login-screen" class="login-box">
  <h2 style="font-size:0.85rem; margin-bottom:8px; color:#ffd23f;">ELAN TU PERSONAJE</h2>
  <input type="text" id="username" placeholder="Tu Nombre" maxlength="10">
  <select id="roleSelect">
    <option value="💵|Millonaria Paid">💵 Millonaria Paid (Presupuesto Top)</option>
    <option value="💙|Ciscu Blue">💙 Ciscu Blue (Influencer Star)</option>
    <option value="🎨|Diseñadora Principal">🎨 Diseñadora Principal (Vs Portero)</option>
    <option value="🛡️|Becari@ en Trinchera">🛡️ Becari@ en Trinchera</option>
    <option value="👾|LABASAD Gamer">👾 LABASAD Gamer</option>
  </select>
  <button id="joinBtn" class="btn">¡ENTRAR AL JUEGO!</button>
</div>

<div id="game-controls" style="display:none; width:100%; height:100%; flex-direction:column; align-items:center; justify-content:space-between;">
  <div style="text-align:center; margin-top:10px;">
    <div id="playerDisplay" style="font-size:0.75rem; color:#ffd23f;"></div>
    <div id="roleDisplay" style="font-size:0.5rem; opacity:0.8; margin-top:4px;"></div>
  </div>

  <div id="status-msg" style="font-size:0.65rem; line-height:1.8; margin:auto; padding:20px; background:rgba(255,255,255,0.05); border:3px dashed #ff8c42; text-align:center;">
    👀 MIRA LA PANTALLA PRINCIPAL
  </div>

  <button id="action-btn" style="display:none;">¡PULSA<br>RÁPIDO!</button>

  <div style="font-size:0.5rem; opacity:0.4;">LABASAD QUEST 2026</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

document.getElementById('joinBtn').addEventListener('click', () => {
  const name = document.getElementById('username').value.trim() || 'Jugador';
  const selectedVal = document.getElementById('roleSelect').value.split('|');
  const avatar = selectedVal[0];
  const role = selectedVal[1];

  socket.emit('join-game', { name, avatar, role });

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('game-controls').style.display = 'flex';
  document.getElementById('playerDisplay').innerText = `${avatar} ${name}`;
  document.getElementById('roleDisplay').innerText = role;
});

socket.on('state', (state) => {
  const statusMsg = document.getElementById('status-msg');
  const actionBtn = document.getElementById('action-btn');
  
  if (state.inChallenge) {
    statusMsg.style.display = 'none';
    actionBtn.style.display = 'block';
  } else {
    statusMsg.style.display = 'block';
    actionBtn.style.display = 'none';
    
    if (state.room === 2 && !state.showIntro) {
      statusMsg.innerText = '📍 Misión Lista.\n¡Haz clic en la pantalla grande para empezar!';
    } else if (state.showIntro) {
      statusMsg.innerText = '📜 LEYENDO INSTRUCCIONES EN PANTALLA...';
    } else {
      statusMsg.innerText = '👀 MIRA LA PANTALLA PRINCIPAL';
    }
  }
});

document.getElementById('action-btn').addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate(25);
  socket.emit('tap');
});
</script>
</body>
</html>
